name: Daily Health Check
on:
  schedule:
    # 每天 UTC 6:00 (北京时间 14:00) 运行
    - cron: '0 6 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run health check with auto-fix
        run: python curate_shelves.py --health-check --auto-fix

      - name: Commit and push if changed
        run: |
          git config user.name "bb-radio-bot"
          git config user.email "xinjiebi@gmail.com"
          git add shelves/ health/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto health check $(date -u +%Y-%m-%d)"
            git push
          fi
